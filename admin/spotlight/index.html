<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive"><title>CerneySelects Admin — Chris Cerney</title>
  <link rel="icon" href="/localspotlight/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/admin/style.css"><link rel="stylesheet" href="/admin/spotlight/style.css">
  <script src="/admin/spotlight/app.js" defer></script>
</head>
<body>
  <header class="admin-header"><a class="brand" href="/"><strong>CERNEY</strong><span>SELECTS</span></a><div class="header-actions"><a href="/">View CerneySelects</a><button type="button" id="signOut" hidden>Sign out</button></div></header>
  <main>
    <div class="dashboard-heading"><div><p class="eyebrow">Private dashboard</p><h1>CerneySelects</h1><p>Manage the visibility of paid business listings.</p></div><button type="button" class="primary-button" id="refresh">Refresh</button></div>
    <p class="form-message" id="message" role="status" aria-live="polite">Checking your sign-in…</p>
    <form id="login" hidden><label for="adminPassword">Administrator password</label><input id="adminPassword" name="password" type="password" autocomplete="current-password" required><button class="primary-button" type="submit">Sign in</button></form>
    <p class="admin-note">Hiding a listing removes it from the directory. It does not cancel billing or refund a payment. Manage billing changes in Stripe.</p>
    <div class="spotlight-list" id="list"></div>
  </main>
</body>
</html>
