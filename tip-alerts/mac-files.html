<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#132f46"><title>Mac files · Cerney Tips</title><link rel="stylesheet" href="/tip-alerts/producer.css?v=27"><link rel="stylesheet" href="/tip-alerts/mac-files.css?v=1"><script src="/tip-alerts/mac-files.js?v=2" defer></script></head><body>
<main>
<header><a href="/tip-alerts/producer.html">‹ Producer Desk</a><span id="macState" role="status">Connecting to your Mac…</span></header>
<div class="top"><h1>Mac files</h1></div>
<p id="notice" role="status" aria-live="polite"></p>
<nav id="rootTabs" class="root-tabs" aria-label="Mac folders"></nav>
<nav id="crumbs" class="crumbs" aria-label="Folder path"></nav>

<section id="uploadBox" class="composer" hidden>
<label for="note" class="lead">Add to this story</label>
<textarea id="note" rows="3" maxlength="4000" placeholder="Context for these files (optional). Saved in the story’s “Story Context.md”."></textarea>
<label id="drop" class="drop"><input id="files" type="file" multiple accept="video/*,image/*,audio/*,application/pdf"><span class="drop-title">＋ Upload originals to the Mac</span><span class="drop-hint">Saved in this story’s “Phone Uploads” folder · never overwrites</span></label>
<ul id="uploads" aria-live="polite"></ul>
</section>

<section id="newStory" class="composer" hidden>
<label for="storyName" class="lead">New story folder</label>
<div class="inline"><input id="storyName" maxlength="120" placeholder="Story name 2026-11-11"><button id="createStory" type="button">Create</button></div>
</section>

<section id="paused" hidden><h2>Paused uploads</h2><ul id="pausedList" class="paused"></ul></section>
<ul id="entries" class="entries" aria-live="polite"></ul>

<dialog id="viewer"><div class="viewer-head"><strong id="viewerName"></strong><button id="closeViewer" type="button" class="ghost small">Close</button></div><div id="viewerBody"></div><div id="viewerActions"></div></dialog>
<footer>Private transfers between this phone and your Mac. Nothing is published or kept in the cloud.</footer>
</main></body></html>
